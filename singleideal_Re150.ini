[flow]
aoa     = 0.
aoa_plane = 0
arearef = 0.785
xref = 0.
yref = 0.
zref = 0.
lref = 1.

[ref_state]
Yref_01 = 1.
tref    = 300.
pref    = 101352.
uref    = 57.

[grid]
# (OPZ, default 0) binding GPU: 0 = un device per rank locale (abortisce se i
# rank locali superano le GPU visibili); 1 = tutti i rank su device 0
# (oversubscription deliberata: test/debug multi-rank su una sola GPU)
#gpu_bind = 0
# (OPZ, default 0.8) soglia di skewness oltre la quale la faccia e' marcata
# "bad": ricostruzione al 1° ordine e flusso full-upwind su quella faccia
skew_bad_level = 0.8
# (OPZ, default 0) 0 = calcola le metriche e scrive gridgeo_*.bin;
# 1 = salta il calcolo e rilegge gridgeo_*.bin (deve esistere)
skipgrid       = 1
# (OPZ, default 1) fattore di scala applicato alle coordinate della mesh
scalegrid      = 1.

[modeling]
# (OPZ, default -1) modello RANS/DES (equazione Spalart-Allmaras per nu_tilde):
# -1 = off, 0 = RANS-SA, 1 = DES97, 2 = DDES, 3 = IDDES, 10 = k-omega SST-2003m
# (famiglie: 0-9 un'equazione SA, 10+ due equazioni; con 10 si trasportano
#  rho*k e rho*omega e gli slot aux diventano k/omega/mut/F1)
rans_model     = -1
# (OPZ, default 1) trattamento point-implicit delle sorgenti RANS (SA e SST):
# 1 = il fattore 1/(1-dt*J) scala l'INTERO residuo dello scalare turbolento
#     (dw = dt*R/(1-dt*J): punto fisso indipendente da dt/CFL, standard)
# 0 = legacy: fattore sulla sola sorgente (il punto fisso dipendeva da dt:
#     ~1-2% su P-D nella prima cella a CFL 2). I golden pre-02/09/2026 sono a 0.
rans_impl_mode = 1
# (OPZ, default 0.9) numero di Prandtl turbolento (flussi termici turbolenti e ODE di parete)
prandtl_turb = 0.9
# (OPZ; letti solo con rans_model=10; default TMR: k = 9e-9*a^2,
#  omega = 1e-6*rho*a^2/mu calcolati dallo stato di riferimento)
#k_inf         = 1.0e-3
#omega_inf     = 5.0e+4
# (OPZ, default 0) 1 = SST-sust (TMR/Spalart-Rumsey 2007): sorgenti ambient
#  +beta*·rho·k_inf·omega_inf (eq. k) e +beta(F1)·rho·omega_inf^2 (eq. omega),
#  dentro il point-implicit: l'ambiente (k_inf,omega_inf) e' equilibrio
#  esatto e la turbolenza di farfield non decade prima del corpo. Serve
#  sulle griglie fini (449+), dove il cold start low-Tu laminarizza (13/07)
#sst_sustain   = 1
# (OPZ, default 0) modello LES: 0 = off, >0 = WALE (mu_sgs algebrica).
# RANS e LES sono mutuamente esclusivi (abort se entrambi attivi)
les_model      =  0
# (OPZ, default 1) numero di layer di celle dalla parete per la matching
# location delle wall function (BC tipo 16/18). Con rans_model=10 (SST) la BC
# blended di omega usa comunque la prima cella: tenere 1 (warning se >1)
num_layer_mloc =  1
# (OPZ, default 1; forzato a 2 con les_model>0; default 4 con rans_model=3)
# lunghezza di filtro DES/LES: 1 = deltamax, 2 = deltavol = V^(1/3),
# 3 = blend tramite fd, 4 = Delta_IDDES di Shur et al. 2008
# = min(max(0.15*d_w, 0.15*h_max, h_wn), h_max) (solo rans_model=3: con
# h_max il ramo WMLES dell'IDDES sovrastimava l_LES fino a ~6.7x a parete)
idelta         =  2
# (OPZ, default 0.5) costante del modello WALE, mu_sgs ~ (c_wale*Delta)^2.
# Riferimenti: 0.5 Nicoud&Ducros 1999, 0.325 OpenFOAM; valore storico
# hard-coded di questo codice: 0.65
c_wale         = 0.5

[controls]
# (OBBL) 0 = cold start dallo stato di riferimento; 1 = restart dei campi
# da rst0_*.bin; >1 = restart anche delle statistiche accumulate (itav/itav3d,
# wall_var_mean_*.bin, stat3d0_*.bin). NB: con restart_type>0 le serie temporali
# per-rank (probe, wall_bin, aeroacustica) vengono APPESE, non riscritte.
restart_type    = 1
# (OBBL) numero di iterazioni temporali da eseguire
num_iter        = 500000
# (OBBL) numero di CFL; se cfl < 0 il passo e' fisso dt = -cfl
# (vietato con lts > 0)
cfl             = 1.5
# (OPZ, default 1) ricalcola il passo temporale ogni iter_cfl iterazioni
iter_cfl        = 1
# (OPZ, default 1) stampa residui/forze su schermo e progress.out ogni
# iter_print iterazioni
iter_print      = 100
# (OPZ, default 0) local time stepping: 0 = dt globale (time-accurate),
# 1 = dt locale per cella, SOLO per ricerca dello stazionario
lts             = 0
# (OPZ; letto solo con lts=1; default nessun cap) tetto al passo locale [s]
#dtmax           = 9999.
# (OPZ, default 100) ogni N iterazioni legge control.in: se la prima riga
# inizia con STOP il run termina in modo pulito
iter_stop_check = 100
# (OPZ, default nessun cap; usato solo con lts>0) limite superiore del
# passo locale [s]; valori <= 0 equivalgono a nessun cap
;dtmax           = 1.E06

[fluid]
# (OPZ, default 1) 1 = gas caloricamente perfetto (usa rgas/gamma/sutherland);
# 0 = termodinamica NASA-poly e trasporto tabulato da fluid_prop.bin
simplified_transport = 1
# (OPZ, default 287; solo simplified_transport=1) costante del gas R
# [J/(kg K)]; override per specie: rgas_1, rgas_2
rgas       = 287.303891077476
# (OPZ, default 0.72) numero di Prandtl; override per specie: Prandtl_1, Prandtl_2
Prandtl    = 0.72
# (OPZ, default 0.7) numero di Schmidt turbolento per la diffusione delle
# specie (chiave legacy equivalente: Schmidt)
Schmidt_t  = 0.7
# (OPZ, default 0.7) numero di Schmidt laminare per la diffusione di Fick
# (usato con simplified_transport=1 e N_S>1)
Schmidt_lam= 0.7
# (OPZ, default 1.4; solo simplified_transport=1) rapporto dei calori
# specifici; override per specie: gamma_1, gamma_2
gamma      = 1.4
# (OPZ, default 0.00001765, 273., 111.) coefficienti di Sutherland per aria:
# mu_ref [Pa s], T_ref [K],
# S [K]; override per specie: sutherland_1, sutherland_2
# (default se assente: fit standard aria 1.716e-5 @ 273.15 K, S=110.4 —
#  cambiato il 2026-07-10: il vecchio default 1.765e-5/273/111 dava mu +2.9%)
;sutherland = 0.00001716, 273.15, 110.4
sutherland = 0.4085, 273.15, 110.4

[chemistry]
# (OPZ, default 0) 0 = off; 1 = chimica esplicita (sorgente integrata nell'RK,
# passo limitato dalla rigidita' chimica); 2 = implicita (Rosenbrock + splitting
# di Strang, gestisce la rigidita'). enable_chemistry>0 richiede
# simplified_transport = 0 e il meccanismo in fluid_prop.bin
enable_chemistry      = 0
# (OPZ, default 1; letto solo con enable_chemistry>0) moltiplicatore globale
# dei fattori pre-esponenziali di Arrhenius
arr_preexp_multiplier = 1.

[numerics]
# (OPZ, default 0) generatore random: 0 = disabilitato (seed fisso),
# >0 = riproducibile per rank, <0 = non riproducibile
rand_type        = 2
# (OPZ, default 0) flusso convettivo centrale: < 0 = Ranocha (entropy
# conservative), >= 0 = AEC con n_expansion pari al valore (0 = Aec0)
iflux_scheme_c   = 0
# (OPZ, default 1) flusso dissipativo per il blending: 1 = HLLC, 2 = Rusanov;
# <= 0 oppure >= 3 = schema puro centrale (nessuna dissipazione, sens_bg ignorato)
iflux_scheme_d   = 1
# (OPZ, default 1) 1 = correzione di non-ortogonalita' nei gradienti di faccia
ortho            = 1
# Sensore di Ducros per cella: s = div^2/(div^2+omega^2+eps). Il blending
# verso il flusso dissipativo cresce con smoothstep tra sens_min e sens_max
# (OPZ, default 1) valore del sensore a cui il blending satura a 1
sens_max         = 0.3
# (OPZ, default 0) valore del sensore sotto cui il blending e' 0
sens_min         = 0.2
# (OPZ, default 0) quota minima di flusso dissipativo applicata OVUNQUE
# (floor del blending): 1 = HLLC puro, 0 = decidono solo i sensori
sens_bg          = 1.
# (OPZ, default 0.01) regolarizzazione del sensore di Ducros:
# eps = sens_eps*cref^2/V^(2/3)
sens_eps         = 0.01
# (OPZ, default 0) lunghezza locale nel sensore: 0 = h^2 = V^(2/3) (legacy; su celle estruse
# con Delta_z >> Delta_x la soglia e' ~20x sotto il voluto), 1 = h^2 = V/h_max (= Delta_x*Delta_y
# sulle celle estruse, = h^2 su quelle isotrope)
sens_hmode       = 0
# (OPZ, default 2) sensori sui salti di faccia di p e rho:
# 0 = off (solo Ducros); 1 = max(phi_p,phi_rho) (legacy: anche i contatti/
# shear layer accendono l'upwind); 2 = min(phi_p,phi_rho) (shock-gated:
# servono entrambi i salti, i contatti non attivano l'upwind)
jump_sensor_mode = 2
# (OPZ, default 0.02) soglia inferiore dello smoothstep dei sensori di salto
# (salto relativo per faccia: sotto questa il sensore e' 0)
sens_jump_lo     = 0.02
# (OPZ, default 0.20) soglia superiore (sopra questa il sensore satura a 1)
sens_jump_hi     = 0.20
# (OPZ, default 0) 1 = non calcolare i gradienti (debug, ricostruzione 1° ordine)
grad_skip        = 0
# (OPZ, default 5) soglia di smoothness del limitatore di Venkatakrishnan:
# eps^2 = (K*h/Lref)^3 * phi_cella^2, con h = V^(1/3) e Lref = Vtot^(1/3).
# 0 = nessuna soglia (legacy). NB: fino al 2026-07 stava in [modeling] (il
# codice la legge ancora da li' come fallback)
venkat_K         = 5.
# (OPZ, default 0) lunghezza di riferimento della soglia di Venkatakrishnan [m]:
# eps/phi_c = (K*h/L)^(3/2) con h = V^(1/3) locale. 0 = L = V_tot^(1/3) (legacy: dipende
# dal dominio e dallo span; il K=500 della suite NACA equivale a K=5.22 con L=corda).
# Con L fisica (corda, diametro) K torna nel range di letteratura (~5).
venkat_lref      = 0.
# (OPZ, default 1) esponente dei pesi LSQ dei gradienti di cella: w = 1/|d|^p.
# 1 = inverse distance (legacy); 2 = inverse distance squared (piu' accurato
# per il gradiente normale su celle stirate di boundary layer). Applicato
# coerentemente a matrice normale e RHS; cambia i risultati: rivalidare.
#lsq_grad_pow     = 1
# (OPZ, default 0 = spento) epsilon dell'Implicit Residual Smoothing (IRS):
# (I - eps*L)R = R risolto con Jacobi a ogni stadio RK. SOLO RANS
# (rans_model>=0, validato): accelera la convergenza a regime consentendo
# CFL ~ sqrt(1+4*eps) volte maggiore, il punto fisso stazionario non cambia.
# Valori tipici 0.5-0.8
irs_eps          = 0.
# (OPZ, default 2) iterazioni Jacobi dello smoothing
irs_niter        = 2
# (OPZ, default 0) integratore temporale Runge-Kutta low-storage
# (guida completa: README_time_schemes.txt):
#  0 = Wray/SMR RK3        (3 stadi, ordine 3, legacy - default)
#  1 = SSP RK3 Shu-Osher   (3 stadi, ordine 3, SSP: urti forti, chimica)
#  2 = Carpenter-Kennedy RK45 (5 stadi, ordine 4: instazionario time-accurate)
#  3 = Bogey-Bailly RK46-NL  (6 stadi, ordine 2 ottimizzato: aeroacustica)
# CFL operativi indicativi (misurati, con margine): 2.0-2.5 / 1.8-2.0 / 3.0 / 3.5
# I restart sono compatibili tra schemi (si puo' cambiare schema al restart).
time_scheme      = 0
# --- Opzioni Rosenbrock: lette SOLO con enable_chemistry = 2 (Strang implicito);
# rosenbrock_version e operator_splitting sono OBBLIGATORIE. enable_chemistry = 2
# e' incompatibile con lts > 0 (lo split di Strang usa il dt globale). ---
# versione del solutore implicito: 1 = Jacobiano pieno (Kaps-Rentrop/Shampine),
# 2 = sottospazio di Krylov (ROK4E). Consigliato 1 a N_S piccolo/medio (denso ma
# economico, sistema 4+N_S). 2 e' CONGELATO dal 07/09/2026 (sperimentale, fuori dai gate
# della suite, nessuna garanzia di manutenzione: 5-50 sottopassi/chiamata, FATAL a dt grandi).
rosenbrock_version = 1
# operator splitting: UNICO valore implementato = 2 (Strang); altri => abort
operator_splitting = 2
# (OPZ, default 200) numero massimo di sottopassi chimici per cella
ros_maxsteps       = 2000
# (OPZ, default 40) numero massimo di riduzioni del passo per sottopasso
ros_maxtry         = 40
# (OPZ, default 1e-6) tolleranza relativa del controllo del passo
ros_tol            = 1.0e-6
# (OPZ, default 1e-9) passo chimico iniziale di tentativo [s]
ros_dttry          = 1.0e-9
# (OPZ, default 1e-8) floor assoluto [kg/m^3] della norma d'errore del
# Rosenbrock v1: passo accettato se |err_s| <= ros_tol*|rho_s| + ros_atol
# (prima la tolleranza era assoluta = ros_tol kg/m^3 su tutte le specie)
ros_atol           = 1.0e-8
# (OPZ, default 1) 1 = ogni cella riparte dall'ultimo passo chimico accettato (memoria per
# cella, non salvata nel restart); 0 = legacy, riparte sempre da ros_dttry
ros_dt_memory      = 1
# (OPZ, default 0) diagnostica della chimica implicita: 0 = riepilogo a fine run (sottopassi,
# tempo per chiamata, contatori), 1 = una riga per chiamata quando ci sono anomalie (reiezioni,
# rollback, Newton falliti, celle non integrate), 2 = ogni chiamata
ros_verbose        = 0
# (OPZ, default 0) politica quando una cella esaurisce ros_maxsteps: 0 = ritenta una volta
# (memoria azzerata, passo iniziale dimezzato) poi STOP con diagnostica; 1 = FREEZE (la cella
# resta allo stato d'ingresso, WARNING); 2 = PARTIAL (legacy: stato parzialmente integrato
# mantenuto, WARNING; portava a NaN silenziosi)
ros_fail_policy    = 0
# (OPZ, default 0) indice della cella da tracciare in ros_trace.dat con ros_verbose = 2
ros_trace_cell     = 0
# (OPZ, default 0) 1 = kernel Rosenbrock v1 RIDOTTO alle sole N_S specie (riduzione esatta: rho*u e
# rho*E sono costanti nel sottopasso), Jacobiano FD solo sulle colonne specie, stato locale, un solo
# write-back: stesso controllo del passo del kernel denso, meno memoria locale e meno valutazioni
#ros_reduced        = 0
# (OPZ, default 2) con ros_reduced=1: 2 = differenze finite a due lati (legacy), 1 = a un lato
# (rhs base riusato: 12 invece di 21 valutazioni per sottopasso a N_S=9)
#ros_fd_order       = 2
# (OPZ, default 1.) con ros_reduced=1: floor [kg/m3] della perturbazione FD h = 1e-6*max(|w_s|, floor);
# 1 = legacy (secante su [0,1e-6] per le specie in traccia), 1e-8..1e-6 = perturbazione scalata
#ros_fd_floor       = 1.
# (OPZ, default 0) 1 = gate di inerzia COMPOSIZIONALE: una cella salta la chimica se nessuna delle specie
# in ros_gate_species (combustibile + radicali) ha frazione di massa >= ros_gate_eps (default 1e-12);
# WDOT = 0 e contatore "gated" a fine run. Non usa il modulo del rhs (spegnerebbe l'innesco).
#ros_gate           = 0
#ros_gate_eps       = 1.e-12
#ros_gate_species   = H2, H, O, OH, HO2, H2O2
# (OPZ, default 1) fattore sulla stima viscosa del passo di tempo: la stima storica omette
# 4/3 (sforzo normale), gamma/Pr (energia) e 1/sigma (nu_tilde), rigidezza diffusiva fino a
# ~2x sottostimata. 1 = legacy (bit-identico), 2 = conservativo (celle dominate dalla diffusione)
dt_visc_fac        = 1.

[boundaries]
# (OBBL) numero di patch fisiche: deve coincidere con quello della griglia
# e ogni name_bc_N deve corrispondere, nello stesso ordine, al nome del
# patch della griglia (in caso contrario il run abortisce all'avvio).
num_bc = 5
# Tipi di BC disponibili (tra parentesi i parametri par_bc_N richiesti):
#  1 ingresso supersonico        2 ingresso subsonico (P0 [Pa], T0 [K], tau_rlx [s])
#  3 uscita supersonica          4 uscita subsonica (p [Pa])
#  5 simmetria/parete inviscida  6 parete isoterma (Twall [K])
#  7 portata imposta/grain (mdot [kg/m^2/s], T0 [K])
#  8 parete adiabatica           9 farfield (beta di rilassamento)
# 10 campo imposto da file (tau_rlx [s]; richiede imposed_vars.dat)
# 16 parete isoterma con wall model (Twall [K])
# 18 parete adiabatica con wall model
#    16/18 richiedono un modello RANS attivo. Con SA (rans_model 0-3): wall
#    function ODE classica. Con SST (rans_model=10): automatic wall treatment
#    y+-insensitive (tau/q dalla ODE + omega blended viscoso/log, k Neumann):
#    prima cella da y+~1 a y+~100; con 6/8 l'SST resta wall-resolved (y+~1)
#
# grain: iniezione propellente con mdot = 21 kg/m^2/s e T0 = 3529.5 K
name_bc_1 = in
type_bc_1 = 9
par_bc_1  = 1.
# testa del motore: parete adiabatica
name_bc_2 = bordi
type_bc_2 = 9
par_bc_2  = 1.
name_bc_3 = out
type_bc_3 = 9
par_bc_3  = 1.
name_bc_4 = cyl
type_bc_4 = 8
name_bc_5 = frontBack
type_bc_5 = 5
# Chiavi opzionali per-BC (default = valori dello stato di riferimento):
#  Ys_bc_N  = Y1, ...  composizione al patch (ESATTAMENTE N_S valori; qui N_S=1)
#  bcN_k     = ...     k al patch     (solo rans_model=10; default k_inf)
#  bcN_omega = ...     omega al patch (solo rans_model=10; default omega_inf)
#  bcN_umag = ...      modulo della velocita' al patch (BC 1)
#  bcN_T    = ...      temperatura al patch (BC 1)
#  bcN_p    = ...      pressione al patch (BC 1)
#  bcN_nut  = ...      nu_tilde SA al patch (BC 1/2/7; default 5*muref/rhoref)

[output]
# Tutti gli intervalli sono in tempo fisico [s]; 0 o chiave assente = mai
# (OPZ, default 0 = mai) intervallo di salvataggio dei campi di volume in VTU (FIELDS_AUX/)
dtsave           = 0.02
# (OPZ, default 0 = mai) intervallo di scrittura del restart rst1_*.bin (+ field_info1.dat)
dtsave_restart   = 0.005
# (OPZ, default 0 = mai) intervallo di scrittura delle variabili di parete (binario/VTU)
dtsave_wall_bin  = 10.0001
# (OPZ, default 0 = mai) intervallo di accumulo delle statistiche di parete (medie e rms)
dtstat           = 10.1
# (OPZ, default 0) 1 = statistiche 3D di volume per cella (medie correnti Favre +
# stress di Reynolds + pressione). Cadenza e contatore PROPRI (dtstat3d / itav3d),
# indipendenti dalle wall-stat. Output: stat3d1_<rank>.bin (riletto come stat3d0_ al
# restart con restart_type>1; se manca riparte da zero) e, con enable_stat3d_vtu=1,
# VTU in STAT3D/. Quantita' accumulate (15, ordine fisso): rho, rho*u, rho*v, rho*w,
# rho*T, rho^2, rho*uu, rho*vv, rho*ww, rho*uv, rho*uw, rho*vw, rho*TT, p, p^2.
# Post: Favre ~u=<rho*u>/<rho>, R_ij=<rho*ui*uj>/<rho>-~ui~uj, p_rms^2=<pp>-<p>^2.
enable_stat3d     = 0
# (OPZ, default 0 = mai) intervallo di accumulo delle statistiche 3D [s]
dtstat3d          = 10.1
# (OPZ, default 0) 1 = scrive anche le statistiche 3D in VTU (STAT3D/)
enable_stat3d_vtu = 0
# (OPZ, default 1) formato di lettura restart: supportato solo 1 = seriale
io_type_r        = 1
# (OPZ, default 1) formato di scrittura restart: supportato solo 1 = seriale
io_type_w        = 1
# (OPZ, default 1) 1 = scrittura dei campi di volume in VTU
enable_vtu       = 1
# (OPZ, default 1) VTU ASCII della griglia a setup (skipgrid=0): 0 per mesh grandi
# (a 190M celle decine di GB e minuti di I/O per rank)
enable_grid_vtu  = 0
# (OPZ, default 1) 1 = scrittura dei campi di parete in VTU (WALL_AUX/)
enable_wall_vtu  = 0
# (OPZ, default 1) 1 = scrittura wall_var in binario
enable_wall_bin  = 0
# (OPZ, default 1) layout I/O serie temporale wall_bin: 1 = singolo file per rank
# con append nel tempo (WALLBIN/wall_<rank>.bin); 0 = legacy una cartella+file per
# campione (WALLBIN/<istore>/...)
#wall_bin_io      = 1
# (OPZ, default 0) 1 = sonde puntuali (richiede probe.dat con le coordinate)
enable_probe     = 0
# (OPZ; letto solo con enable_probe>0) intervallo di scrittura delle sonde
dtsave_probe     = 10.0001
# (OPZ; letto solo con enable_probe>0; DEFAULT = tutte le w_aux) indici delle
# variabili w_aux campionate sulle sonde (stessa mappa di list_aux_slice). Se
# assente vengono salvate TUTTE le colonne di w_aux (nv_aux).
#list_probe_var   = 12, 7, 6
# (OPZ; letto solo con enable_probe>0; default 1) interpolazione al punto sonda:
# 1 = LSQ lineare dai centri cella (come gli anelli aeroacustici); 0 = valore
# della cella piu' vicina (legacy).
#probe_interp     = 1
# (OPZ; letto solo con enable_probe>0; default 1) metodo di ricerca probe->cella:
# 1 = griglia di fondo uniforme (bucket), O(ncells+nprobe); 0 = brute force legacy
#probe_search     = 1
# NB: al primo setup il mapping probe->cella viene salvato in
# PROBE/probe_map_<rank>.bin e ai restart viene riletto (restart veloce, niente
# nuova ricerca). La cache si invalida da sola se cambiano ncells o il numero di
# probe; se cambi le COORDINATE in probe.dat mantenendo lo stesso numero, cancella
# i file: rm PROBE/probe_map_*.bin
# (OPZ, default 0) 1 = salvataggio slice assi-allineate in VTU (richiede slice.dat)
enable_slice     = 1
# (OPZ; letto solo con enable_slice>0) intervallo di scrittura delle slice [s]
dtsave_slice     = 5.0e-3
# slice.dat: prima riga = numero di slice; poi una riga "iaxis coord" per slice
#  iaxis 1/2/3 = piano normale a x/y/z (cioe' yz/xz/xy); coord = posizione [m]
#  variabili scritte = list_aux_slice + list_add_aux_slice (come i campi di volume)
#  in ParaView apri SLICE/sliceNNNNNN_IIIIII.pvtu (o la serie); le celle sono uno
#  strato spesso ~1 cella: applica il filtro Slice per il taglio perfettamente piatto
# (OPZ, default 0) formato dei VTU di volume (FIELDS_AUX/STAT3D): 0 = binario
# appended (raw, ~10-50x piu' veloce e file ~3x piu' piccoli, connettivita'
# cachata); 1 = ASCII legacy (debug/ispezione a occhio)
#vtu_ascii = 0
# (OPZ, default: lista standard) indici delle variabili w_aux da scrivere
# nei VTU. Mappa degli slot per QUESTO build (N_S = 1, da index_define.h):
#  1 = Y_1, 2 = vel_x, 3 = vel_y, 4 = vel_z, 5 = energia interna,
#  6 = T, 7 = p, 8 = c, 9 = mu, 10 = sensore, 11 = div, 12 = rho,
#  13 = k_cond, 14 = D_specie, 15 = wdot_1, 16 = HRR,
#  17 = nutilde/mu_sgs (con SA o LES)
# NB: gli indici scalano con N_S (es. con N_S=2 "vel_x, T, p" = 3, 7, 8);
# il codice ora rifiuta indici fuori da 1..nv_aux.
;list_aux_slice     = 2, 6, 7
# (OPZ, default: tutte) variabili aggiuntive: 1 = |grad(rho)| (schlieren),
# 2 = criterio Q
;list_add_aux_slice = 1

[tripping]
# (OPZ, default 0) forzante di tripping per la transizione; se = 1 tutte
# le chiavi seguenti diventano OBBLIGATORIE
enable_trip = 0
# ampiezza della forzante
trip_ampl   = 1.
# centro x della striscia di tripping [m]
trip_x0     = 2.
# centro y (distanza dalla parete) della striscia [m]
trip_y0     = 1.792
# semi-larghezza x della gaussiana [m]
trip_lx     = 0.05
# semi-larghezza y della gaussiana [m]
trip_ly     = 0.03
# intervallo di aggiornamento delle fasi random [s]
trip_ts     = 0.0001
# numero di armoniche azimutali della forzante
trip_nharm  = 11

[grain]
# Sezione unica della superficie del grano (BC tipo 7): rumore di iniezione +
# risposta pressure-coupled della combustione. (La vecchia sezione [grain_noise]
# non è più letta: il codice si ferma con errore se la trova.)
#
# (OPZ, default 0) rumore sulla portata del grain: campo random per faccia,
# rinfrescato a blocchi di durata noise_tau e raccordato nel tempo con
# smoothstep; se = 1, noise_tau e noise_sigma sono OBBLIGATORI.
# Ruolo: floor di ricettività broadband (scorrelato per faccia: la proiezione
# coerente sui modi acustici è ~sigma/sqrt(N_facce), trascurabile).
enable_noise = 0
# durata del blocco temporale del rumore [s] (banda ~ [0, 0.4/noise_tau])
noise_tau    = 1.E-4
# ampiezza relativa (deviazione standard) del rumore sulla portata
noise_sigma  = 0.02
# (OPZ, default 0) risposta pressure-coupled della combustione:
#   mdot *= max(0, 1 + resp_gain*xi),  xi = clamp((p_own-p_lp)/resp_pref, +-resp_clip)
# con p_lp = passa-basso per faccia della pressione owner (costante resp_tau_lp).
# La risposta è PASSA-ALTO: guadagno DC nullo (punto di funzionamento p_c
# invariato), guadagno pieno alle frequenze acustiche. Driving netto del modo
# per resp_gain > 1/gamma (criterio di Rayleigh). Stato p_lp persistito nel
# restart (rst1_resp_*). Se = 1, resp_gain e resp_pref sono OBBLIGATORI.
enable_response = 0
# (OBBL se enable_response=1) guadagno G = Re(R_p) efficace alla frequenza del modo
resp_gain    = 2.0
# (OBBL se enable_response=1) pressione di riferimento [Pa]: la p_c MEDIA MISURATA del run
resp_pref    = 50.e5
# (OPZ, default 0.02) costante di tempo del passa-basso p_lp [s]. Regola:
# 1/(2 pi f_modo) << tau_lp, e SOLO per G_b = resp_gain*pbar/resp_pref > 1
# anche tau_lp < tau_fill/(G_b-1), con tau_fill = rho*V/mdot_tot (per
# G_b <= 1 nessun limite superiore di questa forma): sotto il limite
# inferiore si perde guadagno a f_modo; violando quello superiore il loop
# lento camera+ugello+risposta e' instabile (deriva di p_c, criterio
# G_b < 1 + tau_fill/tau_lp — instabilita' di riempimento indotta dal filtro)
resp_tau_lp  = 0.02
# (OPZ, default 0.1) clamp su |p-p_lp|/resp_pref (saturazione della risposta)
resp_clip    = 0.1
# (OPZ, default 0.) tempo di attivazione della risposta [s] (protezione cold start)
resp_start_time = 0.
# Ghost della BC 7 (dal 07/09/2026, unica formulazione): pressione continua p_g = p_own, rho_g e T_s dal
# bilancio d'entalpia con la portata imposta. La vecchia formulazione a densita' estrapolata (chiave
# mflow_ghost_pmatch) e' stata rimossa: la chiave, se presente, e' un errore d'input.

# =====================================================================
# Sezione letta SOLO dal tool esterno code_walldist (calcolo della wall
# distance); streams_2.exe la ignora completamente.
# =====================================================================
[walldist]
# OPZIONALE — valore iniziale di phi su tutto il dominio (e ghost). Deve essere
# POSITIVO e idealmente maggiore della massima wall distance attesa.
# Default: 1.0
initial_condition = 1000.0

# OPZIONALE — tolleranza per l'arresto sul residuo RMS globale:
#   res = sqrt( sum_celle (1-|grad(phi)|)^2 / ncells_globale )
# (normalizzazione indipendente dal numero di rank MPI). Default: 1.0e-8
# NB: su mesh non ortogonali il residuo puo' plateau-are intorno a 1e-4..1e-6
# per via dello schema upwind al primo ordine: in tal caso usare maxwalldist
# o maxiter come criterio di arresto.
eps = 1.0e-8

# OPZIONALE — numero massimo di iterazioni in pseudo-tempo. Default: 1000000
maxiter = 100000

# OPZIONALE — criterio di arresto alternativo: il calcolo si ferma quando
# max(phi) >= maxwalldist. Default: huge (criterio disattivato)
maxwalldist = 1.0e9

# OPZIONALE — stampa il residuo ogni iterprint iterazioni. Default: 100
iterprint = 100

# OPZIONALE — tipo di restart. Default: 0
#   0 : parte da phi = initial_condition
#  !=0: rilegge walldist_XXXXXX.bin (stessa decomposizione MPI)
restart_type = 1

# OPZIONALE — numero di CFL per lo pseudo-time step: dtau = cfl2 * min(|df|).
# Default: 0.3
cfl2 = 0.3

# OPZIONALE — local time stepping. Default: 0
#   0 : dtau globale (minimo su tutta la mesh)
#  >0 : dtau locale per cella (min sulle facce della cella, limitato da dtmax)
lts2 = 1

# OPZIONALE — limite superiore per il dtau locale (usato solo con lts2 > 0).
# Default: 9999
dtmax = 9999.0

# OPZIONALE — scrittura del campo in formato VTU a fine calcolo. Default: 0
#   0 : nessun output VTU (viene comunque scritto walldist_XXXXXX.bin)
#   1 : scrive anche il .vtu
enable_walldist_vtu = 0

[aeroacoustics_params]
# Modi azimutali a run-time su anelli (x,r): per ogni anello si campiona il campo
# su n_theta punti equispaziati in theta (interpolazione LSQ), si fa la DFT in
# theta e si salva la storia temporale COMPLESSA dei modi m=0..max_mode.
# Variabili (ordine fisso): 1=p, 2=rho, 3=T, 4=u_x, 5=u_r, 6=u_theta.
# (OPZ, default 0) 1 = abilita (richiede rings.dat)
#enable_aeroacoustics = 0
# (OPZ, default 1) asse del getto: 1/2/3 = x/y/z (u_r,u_theta nel piano normale)
#axis                 = 1
# (OPZ, default 32) punti azimutali per anello
#n_theta              = 32
# (OPZ, default 6) salva i modi m = 0..max_mode  (limitato a n_theta/2)
#max_mode             = 6
# (OPZ; letto solo con enable>0) intervallo di salvataggio [s]; scegli sul St max
#dtsave_aeroacoustics = 1.e-5
# rings.dat: prima riga = numero di anelli; poi una riga "x r" per anello
#   (x = coordinata lungo l'asse del getto, r = raggio). Output globale in
#   AERO/aa_modes.bin (header + record complessi appesi); cache stencil/pesi in
#   AERO/aa_map_<rank>.bin (riletta ai restart; cancellala se cambi rings.dat).

